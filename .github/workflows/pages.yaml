name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ main ]  # or 'master'
  pull_request:
    branches: [ main ]  # optionally test PRs
  workflow_dispatch:    # allow manual trigger

# Sets permissions for deploying to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'  # speeds up installs
      
      - name: Install dependencies
        run: npm ci  # 'ci' is faster and deterministic
      
      - name: Run tests (optional)
        run: npm test -- --watch=false
      
      - name: Build the app
        run: npm run build  # adjust to your build script
      
      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist  # adjust to your build output folder

  deploy:
    needs: build
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4