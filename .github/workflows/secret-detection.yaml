name: Secret Detection

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      # Step 1: Get the code
      - name: Get code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      
      # Step 2: Install git-secrets
      - name: Install git-secrets
        run: |
          git clone https://github.com/awslabs/git-secrets.git
          cd git-secrets
          sudo make install
      
      # Step 3: Setup secret checking
      - name: Setup secret checker
        run: |
          git secrets --install
          git secrets --register-aws
          
          # Add patterns - SIMPLE VERSION
          git secrets --add 'AKIA[0-9A-Z]{16}'                    # AWS Keys
          git secrets --add '"api[_-]?key"?:? ?= ?["'"'"']'       # API Keys
          git secrets --add '"secret"?:? ?= ?["'"'"']'            # Secrets
          git secrets --add '"token"?:? ?= ?["'"'"']'             # Tokens
          git secrets --add 'password ='                         # Passwords
          git secrets --add 'BEGIN RSA PRIVATE KEY'              # Private keys
      
      # Step 4: Check for secrets
      - name: Scan for secrets
        id: scan
        run: |
          # Get changed files
          git fetch origin ${{ github.base_ref }}
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}..HEAD)
          
          # Make report
          echo "## 🔍 Secret Scan Results" > report.md
          echo "" >> report.md
          
          FOUND_SECRET=0
          
          # Check each file
          for file in $CHANGED_FILES; do
            if [ -f "$file" ]; then
              echo "Checking: $file"
              RESULT=$(git secrets --scan "$file" 2>&1) || true
              
              if [ ! -z "$RESULT" ]; then
                echo "❌ Found something suspicious in: $file"
                echo "$RESULT" >> report.md
                FOUND_SECRET=1
              fi
            fi
          done
          
          # Save result
          if [ $FOUND_SECRET -eq 1 ]; then
            echo "SECRETS_FOUND=true" >> $GITHUB_ENV
          else
            echo "✅ No secrets found!" >> report.md
            echo "SECRETS_FOUND=false" >> $GITHUB_ENV
          fi
      
      # Step 5: Comment on PR
      - name: Post results
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            let report = fs.readFileSync('report.md', 'utf8');
            const body = `# 🔒 Secret Scan\n\n${report}`;
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            
            const botComment = comments.find(c => 
              c.body.includes('Secret Scan') && c.user.type === 'Bot'
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
      
      # Step 6: Fail if secrets found
      - name: Stop if secrets found
        if: env.SECRETS_FOUND == 'false'
        run: |
          echo "❌❌❌ SECRETS DETECTED! ❌❌❌"
          echo ""
          echo "Please remove these secrets before merging:"
          echo "1. Open the files mentioned above"
          echo "2. Remove or change the secret values"
          echo "3. Use GitHub Secrets or environment variables instead"
          echo "4. Commit and push your changes again"
          exit 1