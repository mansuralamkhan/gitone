name: Secret Detection

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    
    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      
      # Step 2: Install git-secrets
      - name: Install git-secrets
        run: |
          git clone https://github.com/awslabs/git-secrets.git
          cd git-secrets
          sudo make install
      
      # Step 3: Configure git-secrets patterns
      - name: Configure git-secrets
        run: |
          git secrets --install
          git secrets --register-aws
          
          # Add custom patterns
          git secrets --add '["'"'"']?api[_-]?key["'"'"']?\s*[:=]\s*["'"'"'][A-Za-z0-9/+]{20,}["'"'"']'
          git secrets --add '["'"'"']?secret["'"'"']?\s*[:=]\s*["'"'"'][A-Za-z0-9/+]{20,}["'"'"']'
          git secrets --add '["'"'"']?token["'"'"']?\s*[:=]\s*["'"'"'][A-Za-z0-9/_\-+=]{20,}["'"'"']'
          git secrets --add '-----BEGIN RSA PRIVATE KEY-----'
          git secrets --add '-----BEGIN OPENSSH PRIVATE KEY-----'
      
      # Step 4: Scan for secrets in PR changes
      - name: Scan for secrets
        id: scan
        run: |
          # Get list of changed files in PR
          git fetch origin ${{ github.base_ref }}
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}..HEAD)
          
          if [ -z "$CHANGED_FILES" ]; then
            echo "No files changed"
            exit 0
          fi
          
          # Run git-secrets on changed files
          echo "Scanning changed files:"
          echo "$CHANGED_FILES"
          
          # Create report file
          echo "# Secret Scan Report" > report.md
          echo "" >> report.md
          echo "| File | Line | Issue |" >> report.md
          echo "|------|------|-------|" >> report.md
          
          # Scan each changed file
          SCAN_FAILED=false
          for file in $CHANGED_FILES; do
            if [ -f "$file" ]; then
              OUTPUT=$(git secrets --scan -- "$file" 2>&1) || true
              if [ ! -z "$OUTPUT" ]; then
                echo "Found potential secret in: $file"
                echo "$OUTPUT" | while read line; do
                  if [[ $line =~ ^([^:]+):([0-9]+):(.*)$ ]]; then
                    echo "| ${BASH_REMATCH[1]} | ${BASH_REMATCH[2]} | ${BASH_REMATCH[3]} |" >> report.md
                  fi
                done
                SCAN_FAILED=true
              fi
            fi
          done
          
          # Output results
          if [ "$SCAN_FAILED" = true ]; then
            echo "SECRETS_FOUND=true" >> $GITHUB_ENV
            echo "Secrets found! Check the scan report."
          else
            echo "No secrets detected in this PR."
            echo "✅ No secrets detected in this PR." >> report.md
            echo "SECRETS_FOUND=false" >> $GITHUB_ENV
          fi
      
      # Step 5: Comment on PR
      - name: Comment on PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.md', 'utf8');
            
            const issueNumber = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            // Get existing comments
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: issueNumber
            });
            
            // Check if we already posted
            const botComment = comments.find(comment => 
              comment.body.includes('Secret Scan Report') &&
              comment.user.type === 'Bot'
            );
            
            const commentBody = `## 🔍 Secret Scan Report\n\n${report}`;
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: commentBody
              });
            }
      
      # Step 6: Fail the workflow if secrets found
      - name: Fail if secrets detected
        if: env.SECRETS_FOUND == 'true'
        run: |
          echo "❌ Secrets detected in the PR. Please remove them before merging."
          echo ""
          echo "To fix this issue:"
          echo "1. Remove the secrets from the files"
          echo "2. Use GitHub Secrets or environment variables instead"
          echo "3. Commit the changes and push again"
          exit 1