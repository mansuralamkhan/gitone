name: CI - Tests
on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Show PR info
        run: |
          echo "🔵 CI running with pull_request"
          echo "Branch: ${{ github.ref }}"
          echo "Event: ${{ github.event_name }}"
          echo "PR Number: ${{ github.event.pull_request.number }}"
      
      - name: Test with npm
        run: |
          npm ci || echo "No package.json, skipping"
          npm test || echo "No tests, skipping"