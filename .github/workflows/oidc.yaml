name: Secure Container Pipeline

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  security-events: write
  attestations: write

jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
      - name: Create Deployment Metadata
        run: |
          mkdir -p deployment-metadata
          IMAGE_REPOSITORY="${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}"
          IMAGE_TAG="${{ github.sha }}"
          IMAGE_DIGEST="${{ steps.build.outputs.digest }}"
          IMAGE_URI="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          jq -n --arg repository "$IMAGE_REPOSITORY" --arg tag "$IMAGE_TAG" --arg digest "$IMAGE_DIGEST" --arg uri "$IMAGE_URI" '{repository:$repository,tag:$tag,digest:$digest,uri:$uri}' > deployment-metadata/deployment-metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-metadata
          path: deployment-metadata/

  security:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: actions/download-artifact@v4
        with:
          name: deployment-metadata
          path: deployment-metadata
      - run: |
          echo "IMAGE_URI=$(jq -r '.uri' deployment-metadata/deployment-metadata.json)" >> $GITHUB_ENV
          echo "IMAGE_REPOSITORY=$(jq -r '.repository' deployment-metadata/deployment-metadata.json)" >> $GITHUB_ENV
          echo "IMAGE_DIGEST=$(jq -r '.digest' deployment-metadata/deployment-metadata.json)" >> $GITHUB_ENV
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_URI }}
          format: sarif
          output: trivy-image-results.sarif
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image-results.sarif
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes "${IMAGE_URI}"
        env:
          COSIGN_EXPERIMENTAL: "true"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true
      - uses: actions/upload-artifact@v4
        with:
          name: verified-deployment-metadata
          path: deployment-metadata/

  register-release:

    name: Register Release

    needs:
      - security

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # Download verified deployment metadata
      # ------------------------------------------------------------

      - name: Download Deployment Metadata

        uses: actions/download-artifact@v4

        with:
          name: verified-deployment-metadata
          path: deployment-metadata

      # ------------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------------

      - name: Checkout Repository

        uses: actions/checkout@v4

        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # Create Release Record directly inside repository
      # ------------------------------------------------------------

      - name: Create Release Registry

        shell: bash

        run: |

          set -euo pipefail

          REPOSITORY=$(
            jq -r '.repository' deployment-metadata/deployment-metadata.json
          )

          TAG=$(
            jq -r '.tag' deployment-metadata/deployment-metadata.json
          )

          DIGEST=$(
            jq -r '.digest' deployment-metadata/deployment-metadata.json
          )

          URI=$(
            jq -r '.uri' deployment-metadata/deployment-metadata.json
          )

          RELEASE_DIR="release-registry/releases/${GITHUB_SHA}"

          mkdir -p "${RELEASE_DIR}"

          cat > "${RELEASE_DIR}/release.yaml" <<EOF
          schemaVersion: "1.0"

          release:
            id: "${GITHUB_SHA}"

          image:
            repository: "${REPOSITORY}"
            tag: "${TAG}"
            digest: "${DIGEST}"
            uri: "${URI}"

          security:
            trivy: passed
            cosign: signed
            slsa: attested
          EOF

          echo "Created release record"

          cat "${RELEASE_DIR}/release.yaml"

      # ------------------------------------------------------------
      # Commit Release Registry
      # ------------------------------------------------------------

      - name: Commit Release Registry

        shell: bash

        run: |

          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add release-registry

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Register release ${GITHUB_SHA}"

          git push

      # ------------------------------------------------------------
      # Upload Release Artifact (optional)
      # ------------------------------------------------------------

      - name: Upload Release Record

        uses: actions/upload-artifact@v4

        with:
          name: release-registry

          path: release-registry/releases/${GITHUB_SHA}