name: Secure Container Pipeline
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  security-events: write
  attestations: write

jobs:
  build-sign-attest:

    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Build and Push Image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Create Deployment Metadata
        env:
          IMAGE_REPOSITORY: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          mkdir -p deployment-metadata

          IMAGE_URI="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"

          jq -n \
            --arg repository "${IMAGE_REPOSITORY}" \
            --arg tag "${IMAGE_TAG}" \
            --arg digest "${IMAGE_DIGEST}" \
            --arg uri "${IMAGE_URI}" \
            '{
              repository:$repository,
              tag:$tag,
              digest:$digest,
              uri:$uri
            }' > deployment-metadata/deployment-metadata.json

          jq . deployment-metadata/deployment-metadata.json

      - name: Upload Deployment Metadata
        uses: actions/upload-artifact@v4
        with:
          name: deployment-metadata
          path: deployment-metadata/

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-image-results.sarif
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-results.sarif

      - name: Upload SARIF Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif
          path: trivy-image-results.sarif

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign Container Image (Keyless)
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          set -euo pipefail

          IMAGE_URI=$(jq -r '.uri' deployment-metadata/deployment-metadata.json)

          echo "Signing ${IMAGE_URI}"

          cosign sign --yes "${IMAGE_URI}"

      - name: Generate SLSA Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Workflow Summary
        run: |
          {
            echo "# Secure Build Summary"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Repository | ${{ github.repository }} |"
            echo "| Commit | ${{ github.sha }} |"
            echo "| Image Digest | ${{ steps.build.outputs.digest }} |"
            echo ""
            echo "## Image URI"
            jq -r '.uri' deployment-metadata/deployment-metadata.json
          } >> "$GITHUB_STEP_SUMMARY"